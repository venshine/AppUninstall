plugins {
    id 'com.android.application'
}

// Firebase 配置文件不入库：真实文件放 .private/keys/google-services.json，构建时同步到本模块。
// 没有该文件时不应用 google-services 插件，App 仍可构建，界面上 FCM / Analytics 显示「未配置」。
def keysFile = rootProject.file('.private/keys/google-services.json')
def servicesFile = file('google-services.json')
if (keysFile.exists() && (!servicesFile.exists() || servicesFile.length() != keysFile.length())) {
    servicesFile.bytes = keysFile.bytes
}
if (servicesFile.exists()) {
    apply plugin: 'com.google.gms.google-services'
}

android {
    namespace = 'com.wx.appuninstall'
    compileSdk = 36

    defaultConfig {
        applicationId = 'com.wx.appuninstall'
        minSdk = 23
        targetSdk = 36
        versionCode = 3
        versionName = '2.0'
    }
    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    testOptions {
        unitTests.includeAndroidResources = true
    }
}

dependencies {
    implementation project(':common')
    implementation platform('com.google.firebase:firebase-bom:34.19.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-analytics'
    // 后台心跳：周期任务最小间隔 15 分钟
    implementation 'androidx.work:work-runtime:2.11.2'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'
}
